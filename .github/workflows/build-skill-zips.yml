name: Build skill zips

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.find.outputs.skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find top-level skill folders
        id: find
        run: |
          skills=$(find . -maxdepth 2 -mindepth 2 -name 'SKILL.md' \
            -not -path './.git/*' -not -path './.github/*' \
            | sed 's|^\./||; s|/SKILL.md$||' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Discovered skills: $skills"

  zip:
    needs: discover
    if: needs.discover.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ${{ matrix.skill }} zip (Claude Code)
        run: zip -r "${{ matrix.skill }}-claude-code.zip" "${{ matrix.skill }}" -x '*.DS_Store'

      - name: Build ${{ matrix.skill }} zip (Claude app)
        # The Claude app has no slash-command mechanism, so leave commands/ out.
        run: zip -r "${{ matrix.skill }}-claude-app.zip" "${{ matrix.skill }}" -x '*.DS_Store' -x "${{ matrix.skill }}/commands/*"

      - name: Upload Claude Code zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.skill }}-claude-code
          path: ${{ matrix.skill }}-claude-code.zip
          retention-days: 90

      - name: Upload Claude app zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.skill }}-claude-app
          path: ${{ matrix.skill }}-claude-app.zip
          retention-days: 90

  release:
    needs: zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all skill zips
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-claude-*'
          merge-multiple: true

      # 90-day workflow artifacts (above) expire; this release doesn't, so it's
      # the permanent, stable-URL place to grab the latest zips from.
      - name: Publish permanent release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: skill-zips-latest
          name: Latest skill zips
          make_latest: false
          body: |
            Auto-published by the **Build skill zips** workflow.
            Built from commit ${{ github.sha }}.

            Assets here are replaced on every push to `main` and never expire.
          files: dist/*
